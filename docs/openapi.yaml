openapi: 3.1.0
info:
  title: CachePilot API
  version: 0.1.0
  description: |
    CachePilot is a tenant-scoped exact and semantic cache for LLM requests.
    It checks Redis first, then Qdrant using local CPU embeddings, before calling
    the configured LLM provider. Authentication is not enabled by default.
  contact:
    name: CachePilot
    url: https://github.com/jay15git/RAG-Cache
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8000
    description: Local Docker service
tags:
  - name: health
    description: Liveness and dependency readiness
  - name: query
    description: Cached LLM query processing
  - name: metrics
    description: JSON and Prometheus operational metrics
  - name: admin
    description: Tenant-scoped cache invalidation
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness check
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /healthz:
    get:
      tags: [health]
      summary: Kubernetes-style liveness check
      responses:
        '200':
          description: Service is running
  /live:
    get:
      tags: [health]
      summary: Liveness check alias
      responses:
        '200':
          description: Service is running
  /ready:
    get:
      tags: [health]
      summary: Dependency readiness check
      responses:
        '200':
          description: Redis, Qdrant, and provider-key readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedHealthResponse'
  /api/v1/query:
    post:
      tags: [query]
      summary: Process one LLM request through the cache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            example:
              query: Explain semantic caching in two sentences.
              tenant_id: demo
              system_prompt_hash: assistant-v1
              temperature: 0.2
              tags: [documentation]
      responses:
        '200':
          description: Generated or cached response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '422':
          description: Invalid request body
        '500':
          description: Internal server error
        '502':
          description: LLM provider error
  /api/v1/metrics:
    get:
      tags: [metrics]
      summary: JSON application and cache metrics
      responses:
        '200':
          description: Metrics summary
  /api/v1/metrics/prometheus:
    get:
      tags: [metrics]
      summary: Prometheus exposition format
      responses:
        '200':
          description: Prometheus text metrics
          content:
            text/plain:
              schema:
                type: string
  /api/v1/admin/cache/{tenant_id}:
    delete:
      tags: [admin]
      summary: Invalidate cache entries for one tenant
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: prefix
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Invalidation result
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, invalidated]
                properties:
                  tenant_id:
                    type: string
                  invalidated:
                    type: integer
components:
  schemas:
    QueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 10000
        provider:
          type: string
          enum: [gemini, openai, anthropic]
          nullable: true
          description: Accepted by the schema; use DEFAULT_LLM_PROVIDER for active routing.
        model:
          type: string
          nullable: true
        max_tokens:
          type: integer
          minimum: 1
          maximum: 4000
          nullable: true
        temperature:
          type: number
          minimum: 0
          maximum: 2
          nullable: true
        use_cache:
          type: boolean
          default: true
        use_semantic_cache:
          type: boolean
          default: true
        tenant_id:
          type: string
          default: default
        system_prompt_hash:
          type: string
          default: ''
        tags:
          type: array
          maxItems: 20
          items:
            type: string
        allow_stale:
          type: boolean
          default: false
    UsageMetrics:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
    CacheInfo:
      type: object
      required: [cache_hit, cache_type, stale]
      properties:
        cache_hit:
          type: boolean
        cache_type:
          type: string
          enum: [exact, semantic]
          nullable: true
        similarity_score:
          type: number
          nullable: true
        stale:
          type: boolean
    QueryResponse:
      type: object
      required: [response, provider, model, usage, cache_info, latency_ms]
      properties:
        response:
          type: string
        provider:
          type: string
        model:
          type: string
        usage:
          $ref: '#/components/schemas/UsageMetrics'
        cache_info:
          $ref: '#/components/schemas/CacheInfo'
        latency_ms:
          type: number
    HealthResponse:
      type: object
      required: [status, environment, version]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        environment:
          type: string
        version:
          type: string
    DetailedHealthResponse:
      type: object
      required: [status, environment, version, components]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, degraded]
        environment:
          type: string
        version:
          type: string
        components:
          type: object
        uptime_seconds:
          type: number
          nullable: true
